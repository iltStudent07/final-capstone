name: CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API — Lint & Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '20']
        exclude:
          - os: windows-latest
            node-version: '18'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect API project
        id: api-project
        shell: bash
        run: |
          if [ -f api/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.api-project.outputs.exists == 'true' && hashFiles('api/package-lock.json') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Set up Node.js without cache
        if: ${{ steps.api-project.outputs.exists == 'true' && hashFiles('api/package-lock.json') == '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install API dependencies
        if: ${{ steps.api-project.outputs.exists == 'true' }}
        working-directory: api
        run: npm ci

      - name: Run API lint
        if: ${{ steps.api-project.outputs.exists == 'true' }}
        working-directory: api
        run: npm run lint

      - name: Run API tests
        if: ${{ steps.api-project.outputs.exists == 'true' }}
        working-directory: api
        run: npm test

      - name: Skip API checks
        if: ${{ steps.api-project.outputs.exists != 'true' }}
        run: echo "No API project found at api/. Skipping API lint and test steps for now."

  client:
    name: Client — Lint & Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '20']
        exclude:
          - os: windows-latest
            node-version: '18'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect client project
        id: client-project
        shell: bash
        run: |
          if [ -f client/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('client/package.json', 'utf8')); process.exit(pkg.scripts?.test ? 0 : 1)"; then
              echo "has-test-script=true" >> "$GITHUB_OUTPUT"
            else
              echo "has-test-script=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "has-test-script=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.client-project.outputs.exists == 'true' && hashFiles('client/package-lock.json') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Node.js without cache
        if: ${{ steps.client-project.outputs.exists == 'true' && hashFiles('client/package-lock.json') == '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install client dependencies
        if: ${{ steps.client-project.outputs.exists == 'true' }}
        working-directory: client
        run: npm ci

      - name: Run client lint
        if: ${{ steps.client-project.outputs.exists == 'true' }}
        working-directory: client
        run: npm run lint

      - name: Run client tests
        if: ${{ steps.client-project.outputs.exists == 'true' && steps.client-project.outputs.has-test-script == 'true' }}
        working-directory: client
        run: npm test

      - name: Skip client tests
        if: ${{ steps.client-project.outputs.exists == 'true' && steps.client-project.outputs.has-test-script != 'true' }}
        run: echo "No client test script defined in client/package.json. Skipping client tests for now."

      - name: Skip client checks
        if: ${{ steps.client-project.outputs.exists != 'true' }}
        run: echo "No client project found at client/. Skipping client lint and test steps for now."

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [api, client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect Dockerfiles
        id: dockerfiles
        shell: bash
        run: |
          if find . \( -path './.git' -o -path './node_modules' \) -prune -o -name 'Dockerfile*' -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Docker build
        if: ${{ steps.dockerfiles.outputs.exists != 'true' }}
        run: echo "No Dockerfiles found yet. Skipping Docker image builds for now."

      - name: Build Docker images
        if: ${{ steps.dockerfiles.outputs.exists == 'true' }}
        shell: bash
        run: |
          if [ -f api/Dockerfile ]; then
            docker build -t final-capstone-api ./api
          fi

          if [ -f client/Dockerfile ]; then
            docker build -t final-capstone-client ./client
          fi
